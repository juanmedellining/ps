services:
  - type: web
    name: dr-alma-psicologo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Lo ingresas manualmente en el dashboard de Render
    healthCheckPath: /health
